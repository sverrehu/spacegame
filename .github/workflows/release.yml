---
name: Release package
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Build
        run: |
          VERSION="$(grep -Po '\d+\.\d+\.\d+' .release-please-manifest.json)"
          PACKAGE="$(echo "${{ github.repository }}" | sed -e 's/.*\///')"
          mkdir builds
          env CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -a -trimpath -ldflags="-s -w" -o builds/"${PACKAGE}-${VERSION}"-linux-amd64
          env CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -a -trimpath -ldflags="-s -w" -o builds/"${PACKAGE}-${VERSION}"-macos-amd64
          env CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -a -trimpath -ldflags="-s -w" -o builds/"${PACKAGE}-${VERSION}"-macos-arm64
          env CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -a -trimpath -ldflags="-s -w" -o builds/"${PACKAGE}-${VERSION}"-windows-amd64.exe

      - name: Push GitHub release artifact
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: builds/*
